services:
  lunwen:
    container_name: lunwen
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /workspace/lunwen
    stdin_open: true
    tty: true
    shm_size: "32gb"
    environment:
      CUDA_VISIBLE_DEVICES: ${CUDA_VISIBLE_DEVICES:-0,1,2,3,4,5,6,7}
      REVIMPACT_MODEL_PATH: ${REVIMPACT_MODEL_PATH:-/models/Qwen/Qwen3-0.6B}
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - .:/workspace/lunwen
      - /data/models:/models:ro
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: ["bash"]
